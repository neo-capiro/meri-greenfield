version: 0.2
env:
  shell: bash
phases:
  build:
    # Preserve the failed phase status while allowing standard artifact upload.
    on-failure: CONTINUE
    commands:
      - timeout --signal=TERM --kill-after=90s 40m bash infra/browser-host/image-build.sh
    finally:
      - test -f image-evidence/cleanup.json
artifacts:
  files:
    - '**/*'
  base-directory: image-evidence
  discard-paths: no
