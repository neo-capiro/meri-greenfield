AWSTemplateFormatVersion: "2010-09-09"
Description: DNS validated TLS certificate for the isolated Portfolio preview

Resources:
  PortfolioPreviewCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: portfolio-preview.app.capiro.ai
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: portfolio-preview.app.capiro.ai
          HostedZoneId: Z085985135X6Q5QT98ZBK
      CertificateTransparencyLoggingPreference: ENABLED
      Tags:
        - Key: Project
          Value: capiro
        - Key: Environment
          Value: portfolio-preview
        - Key: ManagedBy
          Value: cloudformation

Outputs:
  CertificateArn:
    Value: !Ref PortfolioPreviewCertificate
