version: 0.2
env:
  shell: bash
phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - set -euo pipefail
      - node --version
      - npm --version
      - npm --prefix apps/portfolio-web ci --no-audit --no-fund
      - npm exec --prefix apps/portfolio-web -- playwright install --with-deps chromium
  build:
    commands:
      - set -euo pipefail
      - test -n "${EXPECTED_SHA:-}"
      - test "$(cat source-commit.txt)" = "$EXPECTED_SHA"
      - test "$CODEBUILD_SOURCE_VERSION" = "$EXPECTED_S3_VERSION"
      - npm --prefix apps/portfolio-web run typecheck
      - npm --prefix apps/portfolio-web run lint
      - npm --prefix apps/portfolio-web run format:check
      - npm --prefix apps/portfolio-web run architecture
      - npm --prefix apps/portfolio-web test
      - npm --prefix apps/portfolio-web run test:browser
      - npm --prefix apps/portfolio-web run build
      - docker build --pull --platform linux/amd64 -f apps/portfolio-web/Dockerfile -t "$REPOSITORY_URI:$EXPECTED_SHA" apps/portfolio-web
      - bash apps/portfolio-web/deployment/smoke.sh "$REPOSITORY_URI:$EXPECTED_SHA"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${REPOSITORY_URI%%/*}"
      - docker push "$REPOSITORY_URI:$EXPECTED_SHA"
      - aws ecr describe-images --repository-name capiro/portfolio-preview --image-ids "imageTag=$EXPECTED_SHA" --query 'imageDetails[0].{imageDigest:imageDigest,imageTags:imageTags,imageScanStatus:imageScanStatus}' --output json
