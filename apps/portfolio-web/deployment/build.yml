AWSTemplateFormatVersion: "2010-09-09"
Description: Bounded isolated CodeBuild verification and image build for Portfolio preview

Resources:
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /capiro/portfolio-preview/build
      RetentionInDays: 14
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: portfolio-preview-build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/capiro/portfolio-preview/build:log-stream:*
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/capiro/portfolio-preview
  PortfolioBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: capiro-portfolio-preview-build
      Description: Exact-commit Portfolio checks and immutable ECR image build
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 60
      QueuedTimeoutInMinutes: 10
      Source:
        Type: GITHUB
        Location: https://github.com/neo-capiro/meri-greenfield.git
        GitCloneDepth: 1
        BuildSpec: apps/portfolio-web/deployment/buildspec.yml
        ReportBuildStatus: false
      SourceVersion: refs/heads/codex/portfolio-continuation-20261011
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:8.0
        ImagePullCredentialsType: CODEBUILD
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/capiro/portfolio-preview
            Type: PLAINTEXT
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup

Outputs:
  BuildProjectName:
    Value: !Ref PortfolioBuildProject
