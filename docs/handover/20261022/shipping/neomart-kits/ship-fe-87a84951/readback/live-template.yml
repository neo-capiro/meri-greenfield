AWSTemplateFormatVersion: "2010-09-09"
Description: Isolated ECS/ALB network for the Capiro Portfolio preview frontend

Parameters:
  ImageUri:
    Type: String
    Description: Exact ECR image URI including sha256 digest
    AllowedPattern: "^[0-9]{12}\\.dkr\\.ecr\\.us-east-1\\.amazonaws\\.com/capiro/portfolio-preview@sha256:[0-9a-f]{64}$"
  CertificateArn:
    Type: String
    Description: ISSUED ACM certificate for portfolio-preview.app.capiro.ai
  AllowedIngressCidr:
    Type: String
    Description: Approved browser source IPv4 /32
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/32$"
  ClerkPublishableKeySecretArn:
    Type: String
    Description: Secrets Manager ARN with the matching production Clerk publishable key
  ClerkSecretKeySecretArn:
    Type: String
    Description: Secrets Manager ARN with the matching production Clerk secret key
  ClerkKmsKeyArn:
    Type: String
    Description: KMS key ARN protecting the two designated Clerk secrets
  TrackerBackend:
    Type: String
    AllowedValues: [core, intelligence]
    Description: Explicit owner of Bill Tracker requests
  CoreApiBaseUrl:
    Type: String
    Description: Ordinary Core target. Held (503) by the frontend while PreviewReadOnly=true; the preview's own origin keeps production unreachable
    AllowedValues: ["https://portfolio-preview.app.capiro.ai/api", "https://os.capiro.ai/api"]
  StrategyApiBaseUrl:
    Type: String
    AllowedValues: ["", "https://os.capiro.ai/strategy-api"]
  WorkspaceApiBaseUrl:
    Type: String
    AllowedValues: ["https://portfolio-preview.app.capiro.ai/workspace-api", "https://os.capiro.ai/workspace-api"]
  IntelligenceApiBaseUrl:
    Type: String
    AllowedValues: ["https://portfolio-preview.app.capiro.ai/intel-api", "https://os.capiro.ai/intel-api"]
  ExistingAppUrl:
    Type: String
    AllowedValues: ["https://portfolio-preview.app.capiro.ai", "https://os.capiro.ai"]
  PreviewReadOnly:
    Type: String
    AllowedValues: ["false", "true"]
    Description: CAPIRO_PREVIEW_READ_ONLY. "true" holds every ordinary backend call (503) and is required by every first-chat, read and Meri preview gate
  PreviewReadApiBaseUrl:
    Type: String
    AllowedPattern: "^$|^https://[a-z0-9.-]+/api$"
    Description: CAPIRO_PREVIEW_READ_API_BASE_URL for selected-client GET /api/me, /api/clients, /api/clients/<id>
  PreviewReadBackendSource:
    Type: String
    AllowedPattern: "^$|^[0-9a-f]{40}$"
    Description: CAPIRO_PREVIEW_READ_BACKEND_SOURCE; must equal the image's compiled previewBackendSource (31a140cd image = 6542f5b0, e0b47a34 image = 111f269d)
  MeriFirstChatBootstrapEnabled:
    Type: String
    AllowedValues: ["false", "true"]
  MeriFirstChatClientId:
    Type: String
    AllowedPattern: "^$|^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
  PreviewFirstChatBackendSource:
    Type: String
    AllowedValues: ["", "c64f0005cf14d69683aabafa11def4964d766832"]
    Description: CAPIRO_PREVIEW_FIRST_CHAT_BACKEND_SOURCE; the image accepts only c64f0005 (an ancestor of the running Core ade7fc88)
  PreviewFirstChatApiBaseUrl:
    Type: String
    AllowedPattern: "^$|^https://[a-z0-9.-]+/api$"
  MeriApiBaseUrl:
    Type: String
    MaxLength: 512
    AllowedPattern: "^$|^https://[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)*\\.[a-z](?:[a-z0-9-]{0,61}[a-z0-9])?$"
    Description: Feeds both MERI_API_BASE_URL and CAPIRO_PREVIEW_MERI_RUNTIME_ORIGIN so they cannot diverge. HTTPS root origin, no trailing slash
  MeriConversationWorkflowEnabled:
    Type: String
    AllowedValues: ["false", "true"]
  PreviewMeriConversationRoutesEnabled:
    Type: String
    AllowedValues: ["false", "true"]
  PreviewMeriRuntimeSource:
    Type: String
    AllowedPattern: "^$|^[0-9a-f]{40}$"
  PreviewMeriRuntimeImageDigest:
    Type: String
    AllowedPattern: "^$|^sha256:[0-9a-f]{64}$"
  PreviewMeriContractPackageVersion:
    Type: String
    AllowedValues: ["", "0.1.8", "0.1.9", "0.1.10"]
    Description: Frontend consumer distribution version compiled into the image (previewMeriContractsPackageVersion)

Rules:
  FirstChatRequiresReadOnlyAndBindings:
    RuleCondition: !Equals [!Ref MeriFirstChatBootstrapEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref PreviewReadOnly, "true"]
        AssertDescription: First-chat bootstrap requires PreviewReadOnly=true
      - Assert: !Not [!Equals [!Ref MeriFirstChatClientId, ""]]
        AssertDescription: First-chat bootstrap requires one client UUID
      - Assert: !Not [!Equals [!Ref PreviewFirstChatBackendSource, ""]]
        AssertDescription: First-chat bootstrap requires the reviewed Core source marker
      - Assert: !Not [!Equals [!Ref PreviewFirstChatApiBaseUrl, ""]]
        AssertDescription: First-chat bootstrap requires the Core preview /api base
      - Assert: !Equals [!Ref MeriConversationWorkflowEnabled, "true"]
        AssertDescription: First-chat bootstrap is only surfaced with the Meri conversation workflow
  MeriRoutesRequireBinding:
    RuleCondition: !Equals [!Ref PreviewMeriConversationRoutesEnabled, "true"]
    Assertions:
      - Assert: !Equals [!Ref PreviewReadOnly, "true"]
        AssertDescription: Meri preview routes require PreviewReadOnly=true
      - Assert: !Equals [!Ref MeriConversationWorkflowEnabled, "true"]
        AssertDescription: Meri preview routes require the conversation workflow
      - Assert: !Not [!Equals [!Ref MeriApiBaseUrl, ""]]
        AssertDescription: Meri preview routes require an HTTPS Meri origin
      - Assert: !Not [!Equals [!Ref PreviewMeriRuntimeSource, ""]]
        AssertDescription: Meri preview routes require the runtime source commit
      - Assert: !Not [!Equals [!Ref PreviewMeriRuntimeImageDigest, ""]]
        AssertDescription: Meri preview routes require the runtime image digest
      - Assert: !Equals [!Ref PreviewMeriContractPackageVersion, "0.1.10"]
        AssertDescription: Meri preview routes require contract package 0.1.10 (compiled into image 4ea553fe)
  ReadGateRequiresBinding:
    RuleCondition: !Not [!Equals [!Ref PreviewReadApiBaseUrl, ""]]
    Assertions:
      - Assert: !Equals [!Ref PreviewReadOnly, "true"]
        AssertDescription: The preview read target is only meaningful with PreviewReadOnly=true
      - Assert: !Not [!Equals [!Ref PreviewReadBackendSource, ""]]
        AssertDescription: The preview read target requires its backend source marker
Resources:
  PreviewVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.90.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: capiro-portfolio-preview
        - Key: Environment
          Value: portfolio-preview
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref PreviewVpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PreviewVpc
      CidrBlock: 10.90.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: capiro-portfolio-preview-a
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PreviewVpc
      CidrBlock: 10.90.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: capiro-portfolio-preview-b
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref PreviewVpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable
  PublicSubnetBRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Approved browser HTTPS ingress for Portfolio preview
      VpcId: !Ref PreviewVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedIngressCidr
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5188
          ToPort: 5188
          CidrIp: 10.90.0.0/16
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Portfolio task ingress only from its preview ALB
      VpcId: !Ref PreviewVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5188
          ToPort: 5188
          SourceSecurityGroupId: !Ref AlbSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
  PreviewAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups: [!Ref AlbSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
  PreviewTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref PreviewVpc
      TargetType: ip
      Protocol: HTTP
      Port: 5188
      HealthCheckEnabled: true
      HealthCheckPath: /healthz
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
  PreviewListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PreviewAlb
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref PreviewTargetGroup
  PreviewCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: capiro-portfolio-preview
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
  PreviewLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /capiro/portfolio-preview
      RetentionInDays: 14
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: portfolio-preview-bootstrap
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/capiro/portfolio-preview
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/capiro/portfolio-preview:log-stream:*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref ClerkPublishableKeySecretArn
                  - !Ref ClerkSecretKeySecretArn
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Ref ClerkKmsKeyArn
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
  PreviewTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: capiro-portfolio-preview
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: portfolio-web
          Essential: true
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 5188
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PreviewLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: portfolio
          Secrets:
            - Name: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
              ValueFrom: !Ref ClerkPublishableKeySecretArn
            - Name: CLERK_SECRET_KEY
              ValueFrom: !Ref ClerkSecretKeySecretArn
          Environment:
            - Name: CORE_API_BASE_URL
              Value: !Ref CoreApiBaseUrl
            - Name: STRATEGY_API_BASE_URL
              Value: !Ref StrategyApiBaseUrl
            - Name: WORKSPACE_API_BASE_URL
              Value: !Ref WorkspaceApiBaseUrl
            - Name: INTELLIGENCE_API_BASE_URL
              Value: !Ref IntelligenceApiBaseUrl
            - Name: CAPIRO_EXISTING_APP_URL
              Value: !Ref ExistingAppUrl
            - Name: TRACKER_BACKEND
              Value: !Ref TrackerBackend
            - Name: CAPIRO_PREVIEW_READ_ONLY
              Value: !Ref PreviewReadOnly
            - Name: ONBOARD_API_BASE_URL
              Value: ""
            - Name: CAPIRO_PREVIEW_READ_API_BASE_URL
              Value: !Ref PreviewReadApiBaseUrl
            - Name: CAPIRO_PREVIEW_READ_BACKEND_SOURCE
              Value: !Ref PreviewReadBackendSource
            - Name: MERI_FIRST_CHAT_BOOTSTRAP_ENABLED
              Value: !Ref MeriFirstChatBootstrapEnabled
            - Name: MERI_FIRST_CHAT_CLIENT_ID
              Value: !Ref MeriFirstChatClientId
            - Name: CAPIRO_PREVIEW_FIRST_CHAT_BACKEND_SOURCE
              Value: !Ref PreviewFirstChatBackendSource
            - Name: CAPIRO_PREVIEW_FIRST_CHAT_API_BASE_URL
              Value: !Ref PreviewFirstChatApiBaseUrl
            - Name: MERI_API_BASE_URL
              Value: !Ref MeriApiBaseUrl
            - Name: CAPIRO_PREVIEW_MERI_RUNTIME_ORIGIN
              Value: !Ref MeriApiBaseUrl
            - Name: MERI_CONVERSATION_WORKFLOW_ENABLED
              Value: !Ref MeriConversationWorkflowEnabled
            - Name: CAPIRO_PREVIEW_MERI_CONVERSATION_ROUTES_ENABLED
              Value: !Ref PreviewMeriConversationRoutesEnabled
            - Name: CAPIRO_PREVIEW_MERI_RUNTIME_SOURCE
              Value: !Ref PreviewMeriRuntimeSource
            - Name: CAPIRO_PREVIEW_MERI_RUNTIME_IMAGE_DIGEST
              Value: !Ref PreviewMeriRuntimeImageDigest
            - Name: CAPIRO_PREVIEW_MERI_CONTRACT_PACKAGE_VERSION
              Value: !Ref PreviewMeriContractPackageVersion
            - Name: MERI_ACTION_WORKFLOW_ENABLED
              Value: "false"
            - Name: MERI_DOCUMENT_WORKFLOW_ENABLED
              Value: "false"
            - Name: MERI_DOCUMENT_OPERATION
              Value: ""
            - Name: CAPIRO_DEFAULT_PRODUCT
              Value: "portfolio"
            - Name: CAPIRO_REQUEST_ORIGIN
              Value: "https://portfolio-preview.app.capiro.ai"
  PreviewService:
    Type: AWS::ECS::Service
    DependsOn: PreviewListener
    Properties:
      Cluster: !Ref PreviewCluster
      ServiceName: capiro-portfolio-preview
      TaskDefinition: !Ref PreviewTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      LoadBalancers:
        - ContainerName: portfolio-web
          ContainerPort: 5188
          TargetGroupArn: !Ref PreviewTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref TaskSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Portfolio preview has an unhealthy registered target
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt PreviewAlb.LoadBalancerFullName
        - Name: TargetGroup
          Value: !GetAtt PreviewTargetGroup.TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: missing

Outputs:
  AlbDnsName:
    Value: !GetAtt PreviewAlb.DNSName
  AlbHostedZoneId:
    Value: !GetAtt PreviewAlb.CanonicalHostedZoneID
  ServiceArn:
    Value: !Ref PreviewService
  VpcId:
    Value: !Ref PreviewVpc
  TargetGroupArn:
    Value: !Ref PreviewTargetGroup

