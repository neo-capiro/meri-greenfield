# Meri representative-task suite: 60 slots across the plan's five capability groups.
# Only SYNTHETIC_RUNNABLE slots are generated as tests; AWAITING_APPROVED_REAL_REQUEST_SOURCE slots never run.
# The provider is a deterministic scripted runtime over offline targets: no model, SDK query, network or database.
# Results are LOCAL_FIXTURE observations, not model-accuracy or live acceptance evidence.
# The owner withdrew the unavailable 48-case / 60-real-task release prerequisite on 2026-11-05.
description: Meri deterministic regression grading (LOCAL_FIXTURE; live acceptance reported separately)
prompts:
  - '{{prompt}}'
providers:
  - id: file://provider.mjs
    label: meri-synthetic-deterministic
tests: file://cases/index.mjs
evaluateOptions:
  maxConcurrency: 1
  cache: false
